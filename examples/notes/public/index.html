<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notes, in SQLite</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 40rem;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        form {
            display: flex;
            gap: 0.5rem;
        }
        input {
            flex: 1;
            padding: 0.4rem;
            font: inherit;
        }
        #search {
            width: 100%;
            margin-top: 0.5rem;
            box-sizing: border-box;
        }
        ul {
            padding: 0;
            list-style: none;
        }
        li {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.4rem 0;
            border-bottom: 1px solid #8884;
        }
        #message {
            color: GrayText;
        }
    </style>
</head>
<body>
    <h1>Notes, in SQLite</h1>
    <p>
        PHP keeps the notes in SQLite, in a file that the page keeps in
        IndexedDB: they are still here after a reload. The search is the
        full-text search of SQLite, FTS5.
    </p>

    <form id="add">
        <input name="text" placeholder="A new note" required autocomplete="off">
        <button>Add</button>
    </form>
    <input id="search" type="search" placeholder="Search" autocomplete="off">
    <ul id="notes"></ul>
    <p id="message">Loading PHP…</p>

    <script type="module">
        import createPhp from './build/php-web.mjs';

        const message = document.getElementById('message');
        const notes = document.getElementById('notes');
        const search = document.getElementById('search');

        // /notes, where the database is, is kept in IndexedDB: the rest of the
        // filesystem goes away with the page
        const php = await createPhp({ persist: '/notes' });

        async function request(action, data = {}) {
            try {
                const { exitCode, stdout, stderr } = await php.runFile('/app/notes.php', {
                    stdin: JSON.stringify({ action, search: search.value, ...data }),
                });
                if (0 !== exitCode) {
                    throw new Error(`PHP exits with ${exitCode}: ${stdout}${stderr}`);
                }

                notes.innerHTML = stdout;
            } catch (error) {
                message.textContent = error.message;
                throw error;
            }
        }

        document.getElementById('add').addEventListener('submit', async (event) => {
            event.preventDefault();
            await request('add', { text: event.target.elements.text.value });
            event.target.reset();
        });
        search.addEventListener('input', () => request('list'));
        notes.addEventListener('click', (event) => {
            if (event.target.dataset.id !== undefined) {
                request('delete', { id: Number(event.target.dataset.id) });
            }
        });
        // What another tab wrote
        document.addEventListener('visibilitychange', () => {
            if ('visible' === document.visibilityState) {
                request('list');
            }
        });

        await request('list');
        message.textContent = '';
    </script>
</body>
</html>
