name: Build

# Builds every stack of stacks.php, one job each, and checks that it works: the
# PHP version and the extensions are the ones that were asked for. The sizes of
# the .wasm files are then compared with the default stack.

on:
  pull_request:
    paths-ignore:
      - '**.rst'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**.rst'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A build of main also fills the cache that the pull requests start from
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # pipefail, unlike the default shell
    shell: bash

jobs:
  stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stacks: ${{ steps.stacks.outputs.stacks }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: castor-php/setup-castor@v1

      - id: stacks
        run: echo "stacks=$(castor --no-ansi wasm:stacks --json)" >> "$GITHUB_OUTPUT"

  build:
    needs: stacks
    name: ${{ matrix.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # The GitHub Actions cache of buildx needs the runtime token and URLs,
      # that only actions get
      - uses: crazy-max/ghaction-github-runtime@v4

      - uses: castor-php/setup-castor@v1

      # The checks run on node, with page.mjs: the version they are made for
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Builds the stack, then checks from node that the PHP version and the
      # extensions are the ones that were asked for. The layers (emsdk, PHP,
      # the libraries…) are cached: one scope per stack, the layers they share
      # are only stored once.
      - name: Test
        env:
          STACK: ${{ matrix.stack }}
        run: |
          castor wasm:test "$STACK" \
            --set "*.cache-from=type=gha,scope=$STACK" \
            --set "*.cache-to=type=gha,scope=$STACK,mode=max,ignore-error=true"

      # Two directories: the artifact keeps their path from the root of the
      # repository
      - uses: actions/upload-artifact@v7
        with:
          name: php-wasm-${{ matrix.stack }}
          path: |
            build/
            examples/*/public/build/
            !build/**/bake.json
          if-no-files-found: error

  sizes:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: castor-php/setup-castor@v1

      # Each artifact is what a job built: build/<stack>/, or the public/build/
      # directory of an example
      - uses: actions/download-artifact@v8
        with:
          pattern: php-wasm-*
          merge-multiple: true

      - name: Sizes
        run: |
          {
            echo '<!-- php-wasm-builder-sizes -->'
            echo '### Sizes'
            echo
            echo '```'
            castor --no-ansi wasm:sizes
            echo '```'
          } | tee "$RUNNER_TEMP/sizes.md" >> "$GITHUB_STEP_SUMMARY"

      # The token of a pull request from a fork can not write
      - name: Comment the sizes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/sizes.md`, 'utf8');
            const marker = body.split('\n')[0];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((comment) => comment.body.startsWith(marker));

            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # page.mjs relies on what node does (--import, the resource timing): the
      # version it is made for
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # page.mjs, that lets node run the modules of a page: it needs no build
      - name: Test page.mjs
        run: node --import ./page.mjs --test tests/page.test.mjs
