name: Build

# Builds every stack of stacks.php, one job each, and checks that it works: the
# PHP version and the extensions are the ones that were asked for, and the
# JavaScript API works. What each job built is kept as an artifact.

on:
  pull_request:
    paths-ignore:
      - '**.rst'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**.rst'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A build of main also fills the cache that the pull requests start from
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # pipefail, unlike the default shell
    shell: bash

jobs:
  stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stacks: ${{ steps.stacks.outputs.stacks }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: castor-php/setup-castor@v1

      - id: stacks
        run: echo "stacks=$(castor --no-ansi wasm:stacks --json)" >> "$GITHUB_OUTPUT"

  build:
    needs: stacks
    name: ${{ matrix.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # The GitHub Actions cache of buildx needs the runtime token and URLs,
      # that only actions get
      - uses: crazy-max/ghaction-github-runtime@v4

      - uses: castor-php/setup-castor@v1

      # The checks run on node, with fetch-files.mjs: the version it is made for
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Builds the stack, then checks from node that the PHP version and the
      # extensions are the ones that were asked for, and that the JavaScript
      # API works. The layers (emsdk, PHP, the libraries…) are cached: one
      # scope per stack, the layers they share are only stored once.
      - name: Check
        env:
          STACK: ${{ matrix.stack }}
        run: |
          castor wasm:check "$STACK" \
            --set "*.cache-from=type=gha,scope=$STACK" \
            --set "*.cache-to=type=gha,scope=$STACK,mode=max,ignore-error=true"

      # Two directories: the artifact keeps their path from the root of the
      # repository
      - uses: actions/upload-artifact@v7
        with:
          name: php-wasm-${{ matrix.stack }}
          path: |
            build/
            examples/*/public/build/
            !build/**/bake.json
          if-no-files-found: error

  fetch-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # fetch-files.mjs relies on what node does (--import, the resource
      # timing): the version it is made for
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # fetch-files.mjs, that lets node run the modules of a page: it needs no
      # build
      - name: Test fetch-files.mjs
        run: node --import ./node/fetch-files.mjs --test tests/fetch-files.test.mjs
